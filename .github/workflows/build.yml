name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UNIVERSAL: "1"
        run: ./build-app.sh

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent "Metal HUD Manager.app" "MetalHUDManager-${{ steps.version.outputs.version }}.zip"

      - name: Create DMG
        run: ./make-dmg.sh "build/MetalHUDManager-${{ steps.version.outputs.version }}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetalHUDManager-${{ steps.version.outputs.version }}
          path: |
            build/*.zip
            build/*.dmg

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./release-notes.sh "${{ steps.version.outputs.version }}" > build/RELEASE_NOTES.md
          cat build/RELEASE_NOTES.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.zip
            build/*.dmg
          body_path: build/RELEASE_NOTES.md
